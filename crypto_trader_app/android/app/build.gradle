plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

// Release signing. In CI these come from GitHub Secrets (see .github/workflows).
// Local dev: create android/key.properties with
//   storePassword=...   keyPassword=...   keyAlias=upload   storeFile=upload-keystore.jks
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader -> keystoreProperties.load(reader) }
}
def hasKeystore = keystorePropertiesFile.exists() &&
        keystoreProperties.getProperty("storeFile") != null &&
        file(rootProject.file(keystoreProperties.getProperty("storeFile"))).exists()

android {
    namespace "com.ai.cryptotrader"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        // Required by some Firebase/Google libs on newer JDKs.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.ai.cryptotrader"
        // Android 7.0+ (BiometricPrompt needs 28 for the best UX, 24 keeps old devices).
        minSdk 24
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        resourceConfigurations += ["en", "es", "ar", "si"]
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
                storeFile file(rootProject.file(keystoreProperties.getProperty("storeFile")))
                storePassword keystoreProperties.getProperty("storePassword")
            }
        }
    }

    buildTypes {
        debug {
            // Fast incremental builds while developing.
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        profile {
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        release {
            // R8: code shrinking + obfuscation + resource shrinking -> < 30MB APK.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Without a keystore we still produce an installable (debug-signed)
            // release APK, so `flutter build apk --release` never fails out of the box.
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/*.kotlin_module", "DebugProbesKt.bin", "kotlin/**"]
        }
    }

    lint {
        disable "InvalidPackage"
        checkReleaseBuilds false
        abortOnError false
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.core:core-ktx:1.13.1"
}
