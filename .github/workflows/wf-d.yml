name: DBG docker job
on:
  push:
    branches: ["**"]
jobs:
  docker:
    name: Backend image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (no push)
        run: docker build -t cryptotrader-backend:ci ./crypto_trader_backend
