name: Deploy website (GitHub Pages)

# Publishes the repo root (the landing page + web terminal) to GitHub Pages.
#
# One-time setup by the repo owner: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that the site lives at
# https://rusindu12.github.io/Ai-/
on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "app/**"
      - "icons/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "og-cover.png"
      - "robots.txt"
      - "sitemap.xml"
      - "tools/check-site.py"
      - "tools/app-tests.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JS parses (app, service worker, inline scripts), every script the app loads
      # exists, every file the service worker precaches exists, no stray text after
      # </html>, manifest is valid, APK link present — see tools/check-site.py
      - name: Sanity-check the site
        run: python3 tools/check-site.py

      # the web app's paper engine, bot rules and live-order code in a Node vm (no
      # browser, no exchange) — keeps the v50 audit fixes fixed; see tools/app-tests.js
      - name: App regression tests
        run: node tools/app-tests.js

      # enablement: true lets the workflow create the Pages site itself with the
      # workflow token (we already request pages: write). If the token is not
      # allowed to do that, enable it once by hand:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Where is it?
        run: echo "Live at ${{ steps.deployment.outputs.page_url }}"
