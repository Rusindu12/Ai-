name: Build AuraOS Android APK

on:
  push:
    branches: [ "arena/01a0a43f-ai", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Copy latest Web App assets
      run: |
        mkdir -p android-project/app/src/main/assets
        cp -r src/public/* android-project/app/src/main/assets/

    - name: Diagnose and Build APK
      run: |
        echo "=== Environment Info ==="
        java -version
        echo "ANDROID_HOME: $ANDROID_HOME"
        ls -la "$ANDROID_HOME" || true
        cd android-project
        gradle -v
        gradle assembleDebug || true
        # Also print any gradle build logs
        find . -name "*.log" -o -name "*.txt" | xargs head -n 30 || true
