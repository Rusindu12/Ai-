name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Make sure Android SDK platform 34 is present
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          echo "SDK root: $SDK"
          SM=""
          for p in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SM="$p"; break; fi
          done
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          else
            echo "sdkmanager not found - relying on the preinstalled image"
          fi

      # Keep going on failure so the log can still be published (log download hosts
      # are not reachable from the workspace, git is).
      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/build.log
          exit "${PIPESTATUS[0]}"
        continue-on-error: true

      - name: Generate Gradle wrapper (for local builds)
        run: |
          gradle --no-daemon wrapper --gradle-version 8.9 2>&1 | tail -5 || true

      - name: Describe the APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          {
          if [ -f "$APK" ]; then
            echo "===== APK ====="
            ls -l "$APK"
            cp "$APK" AITradeSignals-debug.apk
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | tail -1)
            if [ -n "$BT" ] && [ -x "$BT/aapt2" ]; then
              echo "----- aapt2 badging -----"
              "$BT/aapt2" dump badging AITradeSignals-debug.apk | head -30 || true
            fi
            if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
              echo "----- apksigner verify -----"
              "$BT/apksigner" verify --print-certs AITradeSignals-debug.apk 2>&1 | head -12 || true
            fi
            echo "----- zip -----"
            unzip -l AITradeSignals-debug.apk | tail -3
          else
            echo "APK was not produced - see build.log"
          fi
          } 2>&1 | tee -a /tmp/build.log

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AITradeSignals-debug-apk
          path: AITradeSignals-debug.apk
          retention-days: 30
          if-no-files-found: ignore

      # Delivery + diagnostics channel: push the APK (when built) and the full
      # Gradle log to the `apk-output` branch, fetchable with plain git.
      - name: Publish results to apk-output branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHA=$(git rev-parse --short HEAD)
          WORK=$(mktemp -d)
          git fetch --depth=1 origin apk-output || true
          if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
            git worktree add "$WORK" FETCH_HEAD
          else
            git worktree add --detach "$WORK"
          fi
          cp /tmp/build.log "$WORK/build.log"
          [ -f AITradeSignals-debug.apk ] && cp AITradeSignals-debug.apk "$WORK/AITradeSignals-debug.apk" || true
          # also ship the generated Gradle wrapper so `./gradlew assembleDebug` works locally
          mkdir -p "$WORK/gradle/wrapper"
          [ -f gradlew ] && cp gradlew "$WORK/gradlew" || true
          [ -f gradlew.bat ] && cp gradlew.bat "$WORK/gradlew.bat" || true
          [ -f gradle/wrapper/gradle-wrapper.jar ] && cp gradle/wrapper/gradle-wrapper.jar "$WORK/gradle/wrapper/gradle-wrapper.jar" || true
          [ -f gradle/wrapper/gradle-wrapper.properties ] && cp gradle/wrapper/gradle-wrapper.properties "$WORK/gradle/wrapper/gradle-wrapper.properties" || true
          echo "$SHA" > "$WORK/BUILT_FROM"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "$WORK/BUILT_AT"
          cd "$WORK"
          git add -A
          git commit -m "build: results from $SHA" || echo "no changes"
          git push --force origin HEAD:refs/heads/apk-output

      - name: Publish GitHub release with the APK
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -f AITradeSignals-debug.apk ]; then echo "no APK to publish"; exit 0; fi
          TAG="latest-build"
          NOTES="Auto-published debug build from ${GITHUB_SHA}. Install: allow unknown apps for your browser or file manager. Android 8.0+ (minSdk 26). Live trading is OFF by default and Binance Spot Testnet is ON."
          gh release create "$TAG" --title "AI Trade Signals (debug build)" --notes "$NOTES" --target "$GITHUB_REF_NAME" 2>/dev/null || true
          gh release upload "$TAG" AITradeSignals-debug.apk --clobber
          echo "release URL: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Fail the job if the APK is missing
        run: |
          test -f AITradeSignals-debug.apk || { echo "::error::assembleDebug did not produce an APK"; exit 1; }
          echo "APK built OK"
