name: Build Android APK

on:
  workflow_dispatch: {}   # manual trigger from the Actions tab
  push:
    branches: [main, arena/01a090f2-ai]
    paths:
      - 'frontend/**'
      - 'mobile/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # Lock files live in the frontend/ and mobile/ subdirectories, not
          # the repo root, so tell the cache where to find them.
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---- Build the web app into a static bundle ----
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci || npm install

      - name: Build static web export
        working-directory: frontend
        env:
          NEXT_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_API_URL: ${{ vars.BACKEND_URL }}
        run: npm run build

      # ---- Copy the bundle into the Android project ----
      - name: Install Capacitor deps
        working-directory: mobile
        run: npm ci || npm install

      - name: Copy web assets into Android
        working-directory: mobile
        run: npx cap copy android

      # ---- Build the APK ----
      - name: Assemble debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-crypto-trading-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
