name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  android-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS dependencies
        run: npm ci

      - name: Run unit tests
        run: npx jest --ci

      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_newArchEnabled: 'false'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK too (for quick local install)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon || echo "debug build skipped"

      - name: Collect artifacts
        run: |
          mkdir -p apk-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk apk-artifacts/AI-Trading-Bot-release.apk || true
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-artifacts/AI-Trading-Bot-debug.apk || true
          ls -la apk-artifacts

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-trading-bot-apk
          path: apk-artifacts/*.apk
          retention-days: 90
          if-no-files-found: error
