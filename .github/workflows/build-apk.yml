name: Build AuraOS Android APK

on:
  push:
    branches: [ "arena/01a0a43f-ai", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Copy Web Assets
      run: |
        mkdir -p android-project/app/src/main/assets
        cp -r src/public/* android-project/app/src/main/assets/

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        cd android-project
        gradle wrapper --gradle-version 8.5
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuraOS-Ultra.apk
        path: android-project/app/build/outputs/apk/debug/*.apk

    - name: Publish Direct Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: aura-os-latest
        name: "AuraOS Ultra v2.4 (Android Launcher APK)"
        body: "Download and install `app-debug.apk` directly on your Android phone."
        files: android-project/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
