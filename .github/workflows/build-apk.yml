name: Build AuraOS Android APK

on:
  push:
    branches: [ "arena/01a0a43f-ai", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Copy latest Web App assets
      run: |
        mkdir -p android-project/app/src/main/assets
        cp -r src/public/* android-project/app/src/main/assets/

    - name: Init Gradle Wrapper and Build APK
      run: |
        cd android-project
        gradle wrapper --gradle-version 8.5
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuraOS-Launcher-v2.4
        path: android-project/app/build/outputs/apk/debug/*.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/arena') || github.ref == 'refs/heads/main'
      with:
        tag_name: v2.4-aura-apk
        name: "AuraOS Ultra v2.4 (Android + iOS + macOS Fusion APK)"
        body: "Download and install AuraOS directly on your Android device (Android 7.0+)."
        files: android-project/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
