name: DBG apk no-keystore
on:
  push:
    branches: ["**"]
jobs:
  x:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_trader_app
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: '~/.gradle/caches

            ~/.gradle/wrapper

            crypto_trader_app/android/.gradle

            '
          key: gradle-${{ runner.os }}-${{ hashFiles('crypto_trader_app/android/**/*.gradle*', 'crypto_trader_app/pubspec.yaml', 'crypto_trader_app/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install Firebase config (optional)
        if: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON != '' }}
        shell: bash
        run: printf '%s' "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
      - name: pub get
        run: flutter pub get
      - name: Build APK (release, per-ABI, R8 + obfuscation)
        run: "flutter build apk --${{ env.BUILD_TYPE }} \\\n  --split-per-abi \\\n  --obfuscate \\\n  --split-debug-info=build/symbols \\\n  --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}\n"
      - name: Build Play AAB
        run: "flutter build appbundle --${{ env.BUILD_TYPE }} \\\n  --obfuscate \\\n  --split-debug-info=build/symbols \\\n  --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}\n"
      - name: Report sizes
        shell: bash
        run: "echo \"### Artifact sizes\" >> \"$GITHUB_STEP_SUMMARY\"\nfor f in build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/*/*.aab; do\n  [ -f \"$f\" ] || continue\n  size=$(stat -c%s \"$f\")\n  printf -- '- `%s` \u2014 %s MB\\n' \"$(basename \"$f\")\" \"$(awk -v s=\"$size\" 'BEGIN{printf \"%.1f\", s/1048576}')\" >> \"$GITHUB_STEP_SUMMARY\"\ndone\nls -la build/app/outputs/flutter-apk/\n"
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cryptotrader-apk-${{ env.BUILD_TYPE }}
          path: 'crypto_trader_app/build/app/outputs/flutter-apk/*.apk

            crypto_trader_app/build/symbols/**

            '
          if-no-files-found: error
          retention-days: 30
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: cryptotrader-aab-${{ env.BUILD_TYPE }}
          path: crypto_trader_app/build/app/outputs/bundle/*/*.aab
          if-no-files-found: error
          retention-days: 30
      - name: Upload mapping (readable stack traces for crash reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: crypto_trader_app/build/app/outputs/mapping/**/mapping.txt
          if-no-files-found: ignore
          retention-days: 30
