name: DBG header+quality
on:
  push:
    branches: ["**"]
permissions:
  contents: read
concurrency:
  group: dbg-a-${{ github.ref }}
  cancel-in-progress: true
env:
  # Pin a version here (e.g. 3.35.0) if you want byte-identical rebuilds.
  API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://api.your-domain.com' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
jobs:
  quality:
    name: Analyse & test (app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_trader_app
    steps:
      - uses: actions/checkout@v4
      - name: echo
        run: echo "ok ${{ env.BUILD_TYPE }}"
