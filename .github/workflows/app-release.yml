name: Android APK / AAB

# Builds a real release APK + Play AAB from the Flutter app.
# This job is the source of truth for the binary: local builds are identical
# (`cd crypto_trader_app && flutter build apk --release`).

on:
  push:
    branches: [main]
    paths:
      - "crypto_trader_app/**"
      - ".github/workflows/app-release.yml"
  pull_request:
    paths:
      - "crypto_trader_app/**"
  workflow_dispatch:
    inputs:
      build_type:
        description: "release or debug"
        required: false
        default: "release"
      api_base_url:
        description: "Backend base URL baked into the APK"
        required: false
        default: "https://api.your-domain.com"

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin a version here (e.g. 3.35.0) if you want byte-identical rebuilds.
  API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://api.your-domain.com' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}

jobs:
  quality:
    name: Analyse & test (app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_trader_app
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Verify formatting (advisory)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Unit & widget tests
        run: flutter test --reporter expanded

  apk:
    name: Build signed APK + AAB
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # NOTE: the `secrets` context cannot be used in a step `if:`, so the optional
    # signing inputs are projected into job env and tested via `env.` below.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
    defaults:
      run:
        working-directory: crypto_trader_app
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            crypto_trader_app/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('crypto_trader_app/android/**/*.gradle*', 'crypto_trader_app/pubspec.yaml', 'crypto_trader_app/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode keystore (optional)
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storePassword=%s\n'  "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n'    "$KEY_PASSWORD"
            printf 'keyAlias=%s\n'       "$KEY_ALIAS"
            printf 'storeFile=%s\n'      'upload-keystore.jks'
          } > android/key.properties
          keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" | head -5

      - name: Install Firebase config (optional)
        if: env.GOOGLE_SERVICES_JSON != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Check signing setup
        shell: bash
        run: |
          if [ -f android/key.properties ]; then
            echo "Using the uploaded release keystore (Play Store signing key)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret -> APK is signed with the debug key. Fine for sideloading and QA; upload your own keystore secret for Play." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: pub get
        run: flutter pub get

      - name: Build APK (release, per-ABI, R8 + obfuscation)
        run: |
          flutter build apk --${{ env.BUILD_TYPE }} \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Build Play AAB
        run: |
          flutter build appbundle --${{ env.BUILD_TYPE }} \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Report sizes
        shell: bash
        run: |
          echo "### Artifact sizes" >> "$GITHUB_STEP_SUMMARY"
          for f in build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/*/*.aab; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            printf -- '- `%s` — %s MB\n' "$(basename "$f")" "$(awk -v s="$size" 'BEGIN{printf "%.1f", s/1048576}')" >> "$GITHUB_STEP_SUMMARY"
          done
          ls -la build/app/outputs/flutter-apk/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cryptotrader-apk-${{ env.BUILD_TYPE }}
          path: |
            crypto_trader_app/build/app/outputs/flutter-apk/*.apk
            crypto_trader_app/build/symbols/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: cryptotrader-aab-${{ env.BUILD_TYPE }}
          path: crypto_trader_app/build/app/outputs/bundle/*/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload mapping (readable stack traces for crash reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: crypto_trader_app/build/app/outputs/mapping/**/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

  docker:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (no push)
        run: docker build -t cryptotrader-backend:ci ./crypto_trader_backend
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 -e DEMO_MODE=true cryptotrader-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:8000/health >/dev/null 2>&1; then echo healthy; break; fi
            sleep 2
          done
          curl -fsS localhost:8000/health | tee /dev/stderr
          curl -fsS "localhost:8000/api/prices" | head -c 400
          docker logs api | tail -20
