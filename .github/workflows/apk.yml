name: Build APK (Android app)

# Builds the CryptoAI PRO Android app from the web app in this repo (app/) and the
# Android shell (Kotlin + Gradle) from Rusindu12/1 at the commit pinned below.
#
#   every push that touches app/  ->  the APK is attached to the run (artifact)
#   pushes to main                ->  it is also published to this repo's
#                                     "cryptoai-apk-latest" release, which the
#                                     site's Download APK buttons link to
#
# Like the Rusindu12/1 builds, the APK is debug-signed on a fresh runner, so
# Android won't install it over an older CryptoAI PRO: uninstall that one first.
#
# To use a newer Android shell, change SHELL_REF (and VERSION_CODE / VERSION_NAME).
on:
  push:
    paths:
      - "app/**"
      - "tools/app-tests.js"
      - ".github/workflows/apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # only the "Publish" step (main only) writes: the release upload

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash     # -e -o pipefail

env:
  SHELL_REPO: Rusindu12/1
  SHELL_REF: 666ccd0f342c576eccf6551ee81089e950cb53ff   # Rusindu12/1 main, 24 Sep (app v49)
  VERSION_CODE: "50"
  VERSION_NAME: "50.0"
  RELEASE_TAG: cryptoai-apk-latest
  APK_NAME: CryptoAI-PRO.apk

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # the paper engine, bot rules and live-order code, in a Node vm
      - name: App regression tests
        run: node tools/app-tests.js

      - name: Get the Android shell (Rusindu12/1)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SHELL_REPO }}
          ref: ${{ env.SHELL_REF }}
          path: shell
          persist-credentials: false

      - name: Put app/ into the APK and set the version
        run: |
          A=shell/crypto-app/app/src/main/assets
          G=shell/crypto-app/app/build.gradle.kts
          test -f "$A/index.html"
          test -f "$G"
          rm -rf "$A"
          mkdir -p "$A"
          cp -a app/. "$A/"
          sed -i -E "s/versionCode = [0-9]+/versionCode = $VERSION_CODE/; s/versionName = \"[^\"]*\"/versionName = \"$VERSION_NAME\"/" "$G"
          grep -nE "versionCode|versionName" "$G"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Build
        working-directory: shell/crypto-app
        run: gradle assembleDebug --no-daemon --stacktrace

      # the right package and version, a valid signature, and exactly our app/ inside
      - name: Check the APK
        run: |
          trap 'echo "::error title=Check the APK::line $LINENO (exit $?): $BASH_COMMAND"' ERR
          APK=$(ls shell/crypto-app/app/build/outputs/apk/debug/*.apk)
          BT="$ANDROID_HOME/build-tools/34.0.0"          # what AGP 8 builds with
          [ -x "$BT/aapt2" ] || BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "APK: $APK  build-tools: $BT"
          "$BT/aapt2" dump badging "$APK" > badging.txt || echo "::warning title=aapt2::dump badging exit $?"
          PKG=$(grep -m1 "^package:" badging.txt)
          echo "::notice title=APK::$PKG"
          [[ "$PKG" == *"name='com.cryptoai.pro' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"* ]]
          grep -E "^(minSdkVersion|sdkVersion|targetSdkVersion|application-label):" badging.txt || true
          "$BT/apksigner" verify --print-certs "$APK" > signer.txt
          echo "::notice title=Signature::$(grep -m1 "certificate DN" signer.txt)"
          python3 - "$APK" <<'PY'
          import pathlib, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1]); names = set(z.namelist())
          files = sorted(p for p in pathlib.Path("app").rglob("*") if p.is_file())
          bad = [p for p in files if "assets/" + p.relative_to("app").as_posix() not in names
                 or z.read("assets/" + p.relative_to("app").as_posix()) != p.read_bytes()]
          for p in bad:
              print(f"::error title=APK assets::{p} is missing from the APK or different")
          print(f"all {len(files)} files of app/ are in the APK, byte for byte" if not bad else "")
          sys.exit(1 if bad else 0)
          PY
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
          {
            echo "### CryptoAI PRO for Android v$VERSION_NAME"
            echo ""
            echo "- $(echo "$PKG" | cut -d' ' -f2-4)"
            echo "- size: $(du -k "$APK_NAME" | cut -f1) KB, SHA-256 \`$(cut -d' ' -f1 "$APK_NAME.sha256")\`"
            echo "- web app: \`app/\` at ${GITHUB_SHA::7}, Android shell: $SHELL_REPO@${SHELL_REF::7}"
            echo "- download: the artifact below (a zip with the APK inside)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=APK size::$(du -k "$APK_NAME" | cut -f1) KB, sha256 $(cut -d' ' -f1 "$APK_NAME.sha256")"

      - uses: actions/upload-artifact@v6
        with:
          name: CryptoAI-PRO-v${{ env.VERSION_NAME }}-apk
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error

      - name: Publish to the release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          SUM=$(cut -d' ' -f1 "$APK_NAME.sha256")
          cat > notes.md <<EOF
          **CryptoAI PRO for Android v$VERSION_NAME** (versionCode $VERSION_CODE): the web app from
          [\`app/\`](https://github.com/$R/tree/$GITHUB_SHA/app) at ${GITHUB_SHA::7} in the Android shell
          from [$SHELL_REPO@${SHELL_REF::7}](https://github.com/$SHELL_REPO/tree/$SHELL_REF/crypto-app).

          - Android 7.0 or newer. Debug-signed, so Android asks you to allow "install unknown apps".
          - **Already have CryptoAI PRO?** Uninstall it first. Every build is signed with a new
            key, so Android won't install over it ("App not installed"). Uninstalling clears the
            app's data (paper account, brain, saved API keys), so keep your keys at hand.
          - SHA-256: \`$SUM\`

          The same app in the browser: https://rusindu12.github.io/Ai-/app/
          EOF
          if gh release view "$RELEASE_TAG" --repo "$R" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$R" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" --repo "$R" --target "$GITHUB_SHA" \
              --title "CryptoAI PRO — Android APK (latest build)" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --repo "$R" --clobber
          echo "- published: https://github.com/$R/releases/download/$RELEASE_TAG/$APK_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: https://github.com/$R/releases/download/$RELEASE_TAG/$APK_NAME"

      # This session's branch is not main, so the step above does not run. Publish a
      # separate public download the phone can open without an Actions login.
      - name: Publish phone download (arena branch)
        if: github.ref == 'refs/heads/arena/01a0dbef-ai'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          TAG=cryptoai-apk-sleep
          SUM=$(cut -d' ' -f1 "$APK_NAME.sha256")
          cat > notes.md <<EOF
          **CryptoAI PRO v$VERSION_NAME** — AI bot Stop leaves live sells on the exchange and releases the phone.

          Stop කළාම අලුත් AI entries නවතිනවා. Open live trade එක exchange එකේ limit sell (Binance classic නම් OCO) විදිහට තියෙනවා. ඊට පස්සේ screen-on, wake lock, background service එක ඔක්කොම නවතිනවා.

          - Android 7.0 or newer. Debug-signed.
          - **පරණ CryptoAI PRO එක uninstall කරන්න.** අලුත් signature එකක් නිසා උඩින් install වෙන්නේ නෑ.
          - Uninstall කළාම paper ගිණුම, brain, API යතුරු මැකෙනවා. යතුරු ළඟ තියාගෙන ආයෙත් දාන්න.
          - SHA-256: \`$SUM\`
          - commit: ${GITHUB_SHA::7}
          EOF
          if gh release view "$TAG" --repo "$R" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$R" --notes-file notes.md --target "$GITHUB_SHA" --prerelease
          else
            gh release create "$TAG" --repo "$R" --target "$GITHUB_SHA" --prerelease \
              --title "CryptoAI PRO — phone sleeps after Stop" --notes-file notes.md
          fi
          gh release upload "$TAG" "$APK_NAME" "$APK_NAME.sha256" --repo "$R" --clobber
          echo "APK: https://github.com/$R/releases/download/$TAG/$APK_NAME"
