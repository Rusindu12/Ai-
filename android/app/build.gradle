/* Dahat OS — launcher module.
 *
 * The OS itself is not copied into this repo twice: `syncOsAssets` mirrors
 * ../../os into app/src/main/assets/os right before every build, so the APK can
 * never ship a stale OS and git never stores a duplicate.
 */
plugins {
    id 'com.android.application'
}

def osSourceDir = rootProject.file('../os')
if (!osSourceDir.exists()) throw new GradleException("Dahat OS sources not found at ${osSourceDir} — the launcher must sit next to the os/ folder it ships")
def osAssetDir = new File(projectDir, 'src/main/assets/os')

// CI passes these; locally the debug key is used so `assembleRelease` still produces
// an installable file (Android refuses an unsigned APK).
// NOTE: these must not be called `keyAlias`/`storePassword` — inside signingConfigs
// a local variable with the same name as the DSL method shadows it and Groovy fails
// to resolve the call ("No signature of method"). Different names, no shadowing.
def ksFile = System.getenv('DAHAT_KEYSTORE') ?: project.findProperty('dahat.keystore')
def ksStorePass = System.getenv('DAHAT_KEYSTORE_PASSWORD') ?: project.findProperty('dahat.keystorePassword') ?: 'android'
def ksAlias = System.getenv('DAHAT_KEY_ALIAS') ?: project.findProperty('dahat.keyAlias') ?: 'dahat'
def ksKeyPass = System.getenv('DAHAT_KEY_PASSWORD') ?: project.findProperty('dahat.keyPassword') ?: 'android'

// Which key signs a release build, in order of preference: CI's keystore (env or
// -Pdahat.keystore) → the machine's Android debug keystore (so a local
// `assembleRelease` still produces an *installable* file) → no key at all, which
// builds an unsigned APK instead of failing the whole run with
// "Keystore file not set for signing config release".
def ciKey = ksFile ? new File(ksFile.toString()) : null
def debugKey = new File("${System.properties['user.home']}/.android/debug.keystore")
def useCiKey = ciKey != null && ciKey.exists()
def useDebugKey = !useCiKey && debugKey.exists()
def hasSigningKey = useCiKey || useDebugKey
logger.lifecycle("Dahat OS release signing: " + (useCiKey ? "CI keystore (${ksFile})" : useDebugKey ? "local debug keystore (install over it once with a real key)" : "NONE — APK will be unsigned"))

android {
    namespace 'com.dahatos.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dahatos.launcher'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        // the OS build that is baked in, stamped into BuildConfig for the About screen
        buildConfigField 'long', 'OS_BUILD_TIME', "${System.currentTimeMillis()}L"
    }

    signingConfigs {
        if (hasSigningKey) {
            release {
                if (useCiKey) {
                    storeFile ciKey
                    storePassword ksStorePass
                    keyAlias ksAlias
                    keyPassword ksKeyPass
                } else {
                    storeFile debugKey
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                }
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            minifyEnabled false
        }
        release {
            minifyEnabled false   // no reflection on the Java side, and a WebView shell
            shrinkResources false
            if (hasSigningKey) { signingConfig signingConfigs.release }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        // a shell app trips a handful of advisory checks (back-button deprecation,
        // exported activity with no custom lint baseline); never fail a release on them
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/*.version', 'DebugProbesKt.bin']
    }
}


tasks.register('syncOsAssets', Copy) {
    group 'dahat'
    description 'Mirrors ../../os into the APK assets so the launcher always carries the checked-out OS.'
    from(osSourceDir) {
        // the service worker is pointless inside a WebView (and its registration
        // would only log a rejection); the dev-only sources stay out too
        exclude 'sw.js'
        exclude 'assets/img/dahat-mark.svg'
    }
    into osAssetDir
    duplicatesStrategy DuplicatesStrategy.EXCLUDE
}

tasks.named('preBuild') { dependsOn 'syncOsAssets' }

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'   // WebViewAssetLoader + feature checks
    implementation 'androidx.core:core:1.13.1'       // NotificationCompat on API 24
}
